name: Sync Code & Release To Gitee

on:
  push:
    branches: [ main, dev ]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

jobs:
  mirror_code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror all branches and tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://${{ secrets.GITEE_USERNAME }}:${GITEE_TOKEN}@gitee.com/sopyk/webhook2nats.git"
          git push gitee 'refs/remotes/origin/main:refs/heads/main' 'refs/remotes/origin/dev:refs/heads/dev' --tags

  sync_release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: mirror_code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git fetch origin --tags

          # 读取 GitHub Release 信息
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            # workflow_dispatch 情况下获取最新 tag
            TAG=$(git describe --tags --abbrev=0)
          fi
          echo "同步标签: $TAG"

          # 将 tag 推到 Gitee（触发 Gitee 的 release 联动）
          git remote add gitee "https://${{ secrets.GITEE_USERNAME }}:${GITEE_TOKEN}@gitee.com/sopyk/webhook2nats.git"
          git push gitee "$TAG"
